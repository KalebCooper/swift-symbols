name: CI

# Two lanes. SF Symbols exist only on Apple platforms, so the package has no Linux, Android, or
# Windows lane: the iOS Simulator run is the only build and test lane, and it costs money. Batch
# commits and push once, and verify locally before pushing rather than letting CI diagnose a
# failure. The lint lane is cheap and needs no Apple SDK.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  apple:
    name: Build & Test (iOS Simulator)
    runs-on: macos-26
    # Every job in this repository is bounded, so a hang fails the job instead of sitting for the
    # six-hour default. The ceiling is meant to be that job's slowest green run on `main` under its
    # current definition, rounded up to the next five minutes and then tripled. `Scripts/verify.sh`
    # holds the rule that every job has one. No green run exists yet; revisit after the first.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      # Surfaces the runner's real device names so a runner-image bump that renames a simulator is
      # diagnosable from the log, not just a red X.
      - name: List available simulators
        run: xcrun simctl list devices available
      # The OS is pinned instead of `latest` so a runner-image Xcode bump moves the tested platform
      # only when someone edits this line, and it is pinned to the lowest runtime the image carries
      # rather than the newest, so the lane tests something close to the package's own iOS 26 floor.
      # The step above prints what the runner actually has; read it before editing this line.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme swift-symbols-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions

  lint:
    name: swift-format lint
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    # No green run exists yet; revisit after the first.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Show swift-format version
        run: swift format --version
      # Any finding fails the job.
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests
